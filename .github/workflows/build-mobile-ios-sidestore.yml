name: Build Mobile iOS SideStore IPA

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified IPA to the rolling SideStore prerelease
        required: true
        type: boolean
        default: false
      release_notes:
        description: Short purpose shown on the GitHub prerelease
        required: true
        type: string
        default: Physical iPhone acceptance build for Nexora Capstone 2.
  push:
    tags:
      - "ios-sidestore-build-*"

concurrency:
  group: mobile-ios-sidestore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_ios_sideload:
    name: Build and verify unsigned iPhone IPA
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_PUBLIC_API_URL: https://capstone-backend-v2-production.up.railway.app/api
      EXPO_PUBLIC_SOURCE_REVISION: ${{ github.sha }}
      RELEASE_TAG: ios-sidestore-latest
      STABLE_IPA_NAME: Nexora-iOS-latest-unsigned.ipa
      STABLE_METADATA_NAME: Nexora-iOS-latest-metadata.txt
      MOBILE_RELEASE_API_BASE_URL: https://capstone-backend-v2-production.up.railway.app/api/app-version

    steps:
      - name: Check out the requested source revision
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Verify source and release contracts
        working-directory: mobile
        run: |
          npm run test:ios-sidestore
          npm run test:release
          npm run typecheck
          npm run test
          npx expo install --check

      - name: Generate the ephemeral iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        working-directory: mobile
        run: npx --yes pod-install ios

      - name: Resolve the generated workspace and scheme
        shell: bash
        run: |
          set -euo pipefail
          IOS_WORKSPACE=$(find "$GITHUB_WORKSPACE/mobile/ios" -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$IOS_WORKSPACE" ]; then
            echo 'No generated Xcode workspace was found.' >&2
            exit 1
          fi
          IOS_PROJECT=$(find "$GITHUB_WORKSPACE/mobile/ios" -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)
          if [ -z "$IOS_PROJECT" ]; then
            echo 'No generated application Xcode project was found.' >&2
            exit 1
          fi
          IOS_SCHEME=$(basename "$IOS_PROJECT" .xcodeproj)
          SCHEMES_JSON=$(xcodebuild -workspace "$IOS_WORKSPACE" -list -json)
          if ! SCHEMES_JSON="$SCHEMES_JSON" IOS_SCHEME="$IOS_SCHEME" node -e 'const payload = JSON.parse(process.env.SCHEMES_JSON); process.exit(payload.workspace.schemes.includes(process.env.IOS_SCHEME) ? 0 : 1)'; then
            echo "Generated application scheme $IOS_SCHEME was not found in the workspace." >&2
            exit 1
          fi
          printf 'IOS_WORKSPACE=%s\n' "$IOS_WORKSPACE" >> "$GITHUB_ENV"
          printf 'IOS_SCHEME=%s\n' "$IOS_SCHEME" >> "$GITHUB_ENV"
          printf 'workspace=%s\nscheme=%s\n' "$IOS_WORKSPACE" "$IOS_SCHEME"

      - name: Compile the unsigned physical-device Release application
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/nexora-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build | tee "$RUNNER_TEMP/nexora-ios-xcodebuild.log"

      - name: Package the unsigned IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/nexora-ios-derived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo 'No Release-iphoneos application was produced.' >&2
            exit 1
          fi
          OUTPUT_DIR="$GITHUB_WORKSPACE/mobile/dist/ios"
          PACKAGE_ROOT="$RUNNER_TEMP/nexora-ios-package"
          rm -rf "$OUTPUT_DIR" "$PACKAGE_ROOT"
          mkdir -p "$OUTPUT_DIR" "$PACKAGE_ROOT/Payload"
          ditto "$APP_PATH" "$PACKAGE_ROOT/Payload/$(basename "$APP_PATH")"
          (
            cd "$PACKAGE_ROOT"
            zip -qry "$OUTPUT_DIR/$STABLE_IPA_NAME" Payload
          )
          VERSION=$(node -p "require('./mobile/app.json').expo.version")
          BUILD=$(node -p "require('./mobile/app.json').expo.ios.buildNumber")
          SHORT_SHA=${GITHUB_SHA:0:8}
          IMMUTABLE_RELEASE_TAG="ios-sidestore-v${VERSION}-build${BUILD}-${SHORT_SHA}"
          IMMUTABLE_IPA_NAME="Nexora-iOS-v${VERSION}-build${BUILD}-${SHORT_SHA}-unsigned.ipa"
          IMMUTABLE_METADATA_NAME="Nexora-iOS-v${VERSION}-build${BUILD}-${SHORT_SHA}-metadata.txt"
          IMMUTABLE_MANIFEST_NAME="Nexora-iOS-v${VERSION}-build${BUILD}-${SHORT_SHA}-release.json"
          printf 'artifact_name=Nexora-iOS-%s-build%s-%s\n' "$VERSION" "$BUILD" "$SHORT_SHA" >> "$GITHUB_OUTPUT"
          printf 'version=%s\nbuild=%s\nrelease_tag=%s\nipa_name=%s\nmetadata_name=%s\nmanifest_name=%s\n' \
            "$VERSION" "$BUILD" "$IMMUTABLE_RELEASE_TAG" "$IMMUTABLE_IPA_NAME" \
            "$IMMUTABLE_METADATA_NAME" "$IMMUTABLE_MANIFEST_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify the packaged IPA and produce metadata
        shell: bash
        run: |
          mobile/scripts/verify-ios-sidestore-ipa.sh \
            "mobile/dist/ios/$STABLE_IPA_NAME" \
            "mobile/app.json" \
            "mobile/dist/ios/$STABLE_METADATA_NAME" \
            "$GITHUB_SHA"

      - name: Bind the verified IPA to immutable release metadata
        shell: bash
        env:
          IMMUTABLE_RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          IMMUTABLE_IPA_NAME: ${{ steps.package.outputs.ipa_name }}
          IMMUTABLE_METADATA_NAME: ${{ steps.package.outputs.metadata_name }}
          IMMUTABLE_MANIFEST_NAME: ${{ steps.package.outputs.manifest_name }}
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || 'Physical iPhone acceptance build for Nexora Capstone 2.' }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$GITHUB_WORKSPACE/mobile/dist/ios"
          cp "$OUTPUT_DIR/$STABLE_IPA_NAME" "$OUTPUT_DIR/$IMMUTABLE_IPA_NAME"
          cp "$OUTPUT_DIR/$STABLE_METADATA_NAME" "$OUTPUT_DIR/$IMMUTABLE_METADATA_NAME"
          (
            cd "$OUTPUT_DIR"
            shasum -a 256 "$IMMUTABLE_IPA_NAME" > "$IMMUTABLE_IPA_NAME.sha256"
            shasum -a 256 -c "$IMMUTABLE_IPA_NAME.sha256"
          )
          ARTIFACT_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$IMMUTABLE_RELEASE_TAG/$IMMUTABLE_IPA_NAME"
          node mobile/scripts/ios-release-manifest.cjs \
            --app-json mobile/app.json \
            --ipa "$OUTPUT_DIR/$IMMUTABLE_IPA_NAME" \
            --output "$OUTPUT_DIR/$IMMUTABLE_MANIFEST_NAME" \
            --artifact-url "$ARTIFACT_URL" \
            --source-revision "$GITHUB_SHA" \
            --release-notes "$RELEASE_NOTES"

      - name: Upload the immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            mobile/dist/ios/${{ steps.package.outputs.ipa_name }}
            mobile/dist/ios/${{ steps.package.outputs.ipa_name }}.sha256
            mobile/dist/ios/${{ steps.package.outputs.metadata_name }}
            mobile/dist/ios/${{ steps.package.outputs.manifest_name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish the immutable SideStore prerelease
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || 'Physical iPhone acceptance build for Nexora Capstone 2.' }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD: ${{ steps.package.outputs.build }}
          IMMUTABLE_RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          IMMUTABLE_IPA_NAME: ${{ steps.package.outputs.ipa_name }}
          IMMUTABLE_METADATA_NAME: ${{ steps.package.outputs.metadata_name }}
          IMMUTABLE_MANIFEST_NAME: ${{ steps.package.outputs.manifest_name }}
        run: |
          set -euo pipefail
          NOTES_PATH="$RUNNER_TEMP/nexora-ios-release-notes.md"
          {
            printf '# Nexora iOS SideStore build\n\n'
            printf '%s\n\n' "$RELEASE_NOTES"
            printf 'Version: `%s`  \nBuild: `%s`  \nSource: `%s`\n\n' "$VERSION" "$BUILD" "$GITHUB_SHA"
            printf 'This is an unsigned physical-iPhone Release build. SideStore applies the tester’s personal seven-day development signature. Refresh it in SideStore before expiry. This is not an App Store or TestFlight release.\n\n'
            printf 'Follow the [complete Windows and iPhone guide](https://github.com/%s/blob/developement/docs/mobile-ios-sidestore-windows-guide.md).\n' "$GITHUB_REPOSITORY"
          } > "$NOTES_PATH"
          if gh release view "$IMMUTABLE_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Immutable release $IMMUTABLE_RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$IMMUTABLE_RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Nexora iOS SideStore — v$VERSION build $BUILD ($GITHUB_SHA)" \
            --notes-file "$NOTES_PATH" \
            --prerelease \
            "mobile/dist/ios/$IMMUTABLE_IPA_NAME" \
            "mobile/dist/ios/$IMMUTABLE_IPA_NAME.sha256" \
            "mobile/dist/ios/$IMMUTABLE_METADATA_NAME" \
            "mobile/dist/ios/$IMMUTABLE_MANIFEST_NAME"

      - name: Register and verify the published iOS release policy
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        shell: bash
        env:
          CI_ADMIN_SECRET: ${{ secrets.CI_ADMIN_SECRET }}
          IMMUTABLE_RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          IMMUTABLE_MANIFEST_NAME: ${{ steps.package.outputs.manifest_name }}
        run: |
          set -euo pipefail
          MANIFEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$IMMUTABLE_RELEASE_TAG/$IMMUTABLE_MANIFEST_NAME"
          curl --fail --location --retry 5 --retry-delay 2 "$MANIFEST_URL" -o /dev/null
          MOBILE_RELEASE_MANIFEST_PATH="mobile/dist/ios/$IMMUTABLE_MANIFEST_NAME" \
          MOBILE_RELEASE_MANIFEST_URL="$MANIFEST_URL" \
          node .github/scripts/register-mobile-release.cjs

      - name: Refresh the rolling SideStore prerelease
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || 'Physical iPhone acceptance build for Nexora Capstone 2.' }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD: ${{ steps.package.outputs.build }}
          IMMUTABLE_RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          IMMUTABLE_IPA_NAME: ${{ steps.package.outputs.ipa_name }}
          IMMUTABLE_METADATA_NAME: ${{ steps.package.outputs.metadata_name }}
          IMMUTABLE_MANIFEST_NAME: ${{ steps.package.outputs.manifest_name }}
        run: |
          set -euo pipefail
          NOTES_PATH="$RUNNER_TEMP/nexora-ios-release-notes.md"
          {
            printf '# Nexora iOS SideStore latest build\n\n'
            printf '%s\n\n' "$RELEASE_NOTES"
            printf 'Immutable release: [%s](https://github.com/%s/releases/tag/%s)  \nSource: `%s`\n' \
              "$IMMUTABLE_RELEASE_TAG" "$GITHUB_REPOSITORY" "$IMMUTABLE_RELEASE_TAG" "$GITHUB_SHA"
          } > "$NOTES_PATH"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=true
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Nexora iOS SideStore — v$VERSION build $BUILD" \
              --notes-file "$NOTES_PATH" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Nexora iOS SideStore — v$VERSION build $BUILD" \
              --notes-file "$NOTES_PATH" \
              --prerelease
          fi
          gh release upload "$RELEASE_TAG" \
            "mobile/dist/ios/$STABLE_IPA_NAME" \
            "mobile/dist/ios/$STABLE_IPA_NAME.sha256" \
            "mobile/dist/ios/$STABLE_METADATA_NAME" \
            --clobber
          printf '### iOS SideStore release\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '[Immutable release](https://github.com/%s/releases/tag/%s)\n\n' "$GITHUB_REPOSITORY" "$IMMUTABLE_RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          printf '[Direct IPA download](https://github.com/%s/releases/download/%s/%s)\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$STABLE_IPA_NAME" >> "$GITHUB_STEP_SUMMARY"

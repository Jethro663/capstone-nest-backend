name: Build Mobile APK & Update Download Link

on:
  push:
    branches:
      - developement
      - master
    paths:
      - "mobile/src/**"
      - "mobile/app.json"
      - "mobile/package.json"
      - "mobile/android/**"
  workflow_dispatch:

concurrency:
  group: mobile-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-update-apk:
    name: Build Android Release APK & Sync Web Download
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Export Expo JS Bundle
        run: |
          cd mobile
          npx expo export --platform android

      - name: Build Android Release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Replace Embedded APK in Next.js Web Downloads
        run: |
          mkdir -p next-frontend/public/downloads
          cp mobile/android/app/build/outputs/apk/release/app-release.apk next-frontend/public/downloads/nexora-student-mobile-release.apk
          ls -lh next-frontend/public/downloads/nexora-student-mobile-release.apk

      - name: Commit and Push Updated APK File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next-frontend/public/downloads/nexora-student-mobile-release.apk
          git diff-index --quiet HEAD || (git commit -m "chore(download): auto-update student APK release build [skip ci]" && git push)

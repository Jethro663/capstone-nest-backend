name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "next-frontend/**"
      - "mobile/**"
      - "ai-service/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  push:
    branches: [developement, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_unit:
    name: Backend unit and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify deployment status gating
        run: node --test ../.github/scripts/wait-railway-deployment.test.cjs
      - run: npm ci
      - name: Run non-mutating lint baseline
        run: npm run lint
      - run: npm run test -- --ci
      - name: Verify repeatable production builds
        run: |
          npm run build
          npm run build

  backend_e2e:
    name: Backend e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:e2e -- --ci

  migration_bootstrap:
    name: Migration and runtime (${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: [pg16, pg18]
    services:
      postgres:
        image: pgvector/pgvector:${{ matrix.postgres }}
        env:
          POSTGRES_DB: nexora_academic_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_academic_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexora_academic_test_ci
      ACADEMIC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexora_academic_test_ci
      REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply migrations to a fresh pgvector database
        run: node run-migrations.js
      - name: Verify real academic transactions and lifecycle
        run: npm run test:academic -- --ci
      - name: Rehearse a legacy upgrade and migration replay
        env:
          ACADEMIC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexora_academic_test_upgrade
          PGPASSWORD: postgres
        run: |
          createdb --host=127.0.0.1 --username=postgres nexora_academic_test_upgrade
          node test/academic-migration-upgrade.cjs
      - run: npm run build
      - name: Verify the production command starts the full application
        run: npm run test:production-start

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: next-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-frontend/package-lock.json
      - run: npm ci
      - name: Run non-mutating lint baseline
        run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --ci
      - run: npm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  ai_service:
    name: AI service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_SERVICE_SHARED_SECRET: test-shared-secret
      AI_RUNTIME_MODE: test
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.27"
      - name: Verify the generated dependency lock
        run: |
          uv pip compile --python-version 3.12 --python-platform x86_64-unknown-linux-gnu requirements.in --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python scripts/run_tests.py

  quality_reports:
    name: Coverage and dependency reports (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Node dependency reports
        run: |
          mkdir -p reports
          npm audit --omit=dev --prefix backend --json > reports/backend-npm-audit.json || true
          npm audit --omit=dev --prefix next-frontend --json > reports/frontend-npm-audit.json || true
          npm audit --omit=dev --prefix mobile --json > reports/mobile-npm-audit.json || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate AI service dependency report
        run: |
          python -m pip install pip-audit
          pip-audit --requirement ai-service/requirements.txt --format json --output reports/ai-service-pip-audit.json || true
      - name: Generate backend coverage report
        working-directory: backend
        run: |
          npm ci
          npm run test:cov -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            reports/
            backend/coverage/
          if-no-files-found: error

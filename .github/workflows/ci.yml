name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "next-frontend/**"
      - "mobile/**"
      - "ai-service/**"
      - ".github/workflows/**"
  push:
    branches: [developement, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_unit:
    name: Backend unit and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run non-mutating lint baseline
        run: npm run lint
      - run: npm run test -- --ci
      - run: npm run build

  backend_e2e:
    name: Backend e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:e2e -- --ci

  migration_bootstrap:
    name: Migration bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: capstone
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d capstone"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply migrations to a fresh pgvector database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/capstone
        run: node run-migrations.js

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: next-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-frontend/package-lock.json
      - run: npm ci
      - name: Run non-mutating lint baseline
        run: npm run lint
      - run: npm run test -- --ci
      - run: npm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  ai_service:
    name: AI service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_SERVICE_SHARED_SECRET: test-shared-secret
      AI_RUNTIME_MODE: test
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.27"
      - name: Verify the generated dependency lock
        run: |
          uv pip compile --python-version 3.12 --python-platform x86_64-unknown-linux-gnu requirements.in --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python scripts/run_tests.py

  quality_reports:
    name: Coverage and dependency reports (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Node dependency reports
        run: |
          mkdir -p reports
          npm audit --omit=dev --prefix backend --json > reports/backend-npm-audit.json || true
          npm audit --omit=dev --prefix next-frontend --json > reports/frontend-npm-audit.json || true
          npm audit --omit=dev --prefix mobile --json > reports/mobile-npm-audit.json || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate AI service dependency report
        run: |
          python -m pip install pip-audit
          pip-audit --requirement ai-service/requirements.txt --format json --output reports/ai-service-pip-audit.json || true
      - name: Generate backend coverage report
        working-directory: backend
        run: |
          npm ci
          npm run test:cov -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            reports/
            backend/coverage/
          if-no-files-found: error

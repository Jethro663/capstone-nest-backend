name: Railway Deploy (developement)

on:
  workflow_run:
    workflows: [CI]
    branches: [developement]
    types: [completed]

concurrency:
  group: railway-deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy_backend:
    name: Deploy backend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'developement' &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 00b7dfa6-d938-4029-8119-0194a04b5795
      RAILWAY_ENVIRONMENT_NAME: production
      RAILWAY_SERVICE_NAME: capstone-backend-v2
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout CI-tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy CI-tested backend
        working-directory: backend
        run: railway up . --path-as-root --ci --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_NAME" --service "$RAILWAY_SERVICE_NAME"

      - name: Record deployment provenance
        run: |
          echo "tested_sha=$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "ci_run=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy_frontend:
    name: Deploy frontend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'developement' &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 00b7dfa6-d938-4029-8119-0194a04b5795
      RAILWAY_ENVIRONMENT_NAME: production
      RAILWAY_SERVICE_NAME: next-frontend-v2
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout CI-tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy CI-tested frontend
        working-directory: next-frontend
        run: railway up . --path-as-root --ci --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_NAME" --service "$RAILWAY_SERVICE_NAME"

      - name: Record deployment provenance
        run: |
          echo "tested_sha=$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "ci_run=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy_ai_service:
    name: Deploy AI service
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'developement' &&
      github.event.workflow_run.head_sha != ''
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 00b7dfa6-d938-4029-8119-0194a04b5795
      RAILWAY_ENVIRONMENT_NAME: production
      RAILWAY_SERVICE_NAME: ai-service
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout CI-tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy CI-tested AI service
        working-directory: ai-service
        run: railway up . --path-as-root --ci --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_NAME" --service "$RAILWAY_SERVICE_NAME"

      - name: Record deployment provenance
        run: |
          echo "tested_sha=$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "ci_run=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_STEP_SUMMARY"

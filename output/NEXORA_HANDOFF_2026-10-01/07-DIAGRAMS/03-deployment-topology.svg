  <text x="70" y="74" class="title">Deployment topology</text><text x="70" y="112" class="subtitle">The same ownership boundaries apply locally, in Docker Compose, and on Railway.</text><g><rect x="70" y="190" width="310" height="210" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="70" y="190" width="310" height="44" rx="20" fill="#0C1D3A"/><rect x="70" y="214" width="310" height="20" fill="#0C1D3A"/><text x="92" y="221" class="box-title">Public edge</text><text x="92" y="258" class="body">TLS domain</text><text x="92" y="286" class="body">Next.js frontend</text><text x="92" y="314" class="body">mobile API URL</text></g><g><rect x="480" y="190" width="310" height="210" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="480" y="190" width="310" height="44" rx="20" fill="#0C1D3A"/><rect x="480" y="214" width="310" height="20" fill="#0C1D3A"/><text x="502" y="221" class="box-title">Application</text><text x="502" y="258" class="body">NestJS backend</text><text x="502" y="286" class="body">FastAPI AI service</text><text x="502" y="314" class="body">health endpoints</text></g><g><rect x="890" y="190" width="300" height="210" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="890" y="190" width="300" height="44" rx="20" fill="#0C1D3A"/><rect x="890" y="214" width="300" height="20" fill="#0C1D3A"/><text x="912" y="221" class="box-title">Managed state</text><text x="912" y="258" class="body">PostgreSQL + pgvector</text><text x="912" y="286" class="body">Redis</text><text x="912" y="314" class="body">object storage</text></g><g><rect x="1290" y="190" width="240" height="210" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="1290" y="190" width="240" height="44" rx="20" fill="#0C1D3A"/><rect x="1290" y="214" width="240" height="20" fill="#0C1D3A"/><text x="1312" y="221" class="box-title">Models</text><text x="1312" y="258" class="body">Ollama local</text><text x="1312" y="286" class="body">or approved cloud</text></g><g><rect x="480" y="540" width="310" height="170" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="480" y="540" width="310" height="44" rx="20" fill="#0C1D3A"/><rect x="480" y="564" width="310" height="20" fill="#0C1D3A"/><text x="502" y="571" class="box-title">CI and release</text><text x="502" y="608" class="body">GitHub Actions</text><text x="502" y="636" class="body">checks and images</text><text x="502" y="664" class="body">manual approval</text></g><g><rect x="890" y="540" width="300" height="170" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="890" y="540" width="300" height="44" rx="20" fill="#0C1D3A"/><rect x="890" y="564" width="300" height="20" fill="#0C1D3A"/><text x="912" y="571" class="box-title">Operations</text><text x="912" y="608" class="body">logs and metrics</text><text x="912" y="636" class="body">backup and restore</text><text x="912" y="664" class="body">rollback evidence</text></g><g><path d="M 380 295 L 480 295" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="430" y="285" class="label" text-anchor="middle">HTTPS</text></g><g><path d="M 790 295 L 890 295" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g><g><path d="M 1190 295 L 1290 295" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g><g><path d="M 635 540 L 635 400" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="635" y="460" class="label" text-anchor="middle">deploy</text></g><g><path d="M 1040 400 L 1040 540" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="1040" y="460" class="label" text-anchor="middle">observe</text></g>

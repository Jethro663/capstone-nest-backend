<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#DC2626"/></marker></defs>
  <style>.title{font:700 42px Arial,sans-serif;fill:#0C1D3A}.subtitle{font:24px Arial,sans-serif;fill:#475569}.box-title{font:700 23px Arial,sans-serif;fill:#FFFFFF}.body{font:21px Arial,sans-serif;fill:#0F172A}.label{font:700 19px Arial,sans-serif;fill:#B91C1C}</style>
  <rect width="1600" height="900" fill="#F8FAFC"/><rect width="1600" height="12" fill="#DC2626"/>
  <text x="70" y="74" class="title">Backup and recovery sequence</text><text x="70" y="112" class="subtitle">A backup is useful only after integrity checks and a test restore.</text><g><rect x="90" y="225" width="260" height="180" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="90" y="225" width="260" height="44" rx="20" fill="#0C1D3A"/><rect x="90" y="249" width="260" height="20" fill="#0C1D3A"/><text x="112" y="256" class="box-title">1. Prepare</text><text x="112" y="293" class="body">maintenance window</text><text x="112" y="321" class="body">record versions</text><text x="112" y="349" class="body">choose safe folder</text></g><g><rect x="430" y="225" width="260" height="180" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="430" y="225" width="260" height="44" rx="20" fill="#0C1D3A"/><rect x="430" y="249" width="260" height="20" fill="#0C1D3A"/><text x="452" y="256" class="box-title">2. Capture</text><text x="452" y="293" class="body">pg_dump custom format</text><text x="452" y="321" class="body">copy object files</text><text x="452" y="349" class="body">save configuration map</text></g><g><rect x="770" y="225" width="260" height="180" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="770" y="225" width="260" height="44" rx="20" fill="#0C1D3A"/><rect x="770" y="249" width="260" height="20" fill="#0C1D3A"/><text x="792" y="256" class="box-title">3. Verify</text><text x="792" y="293" class="body">checksum files</text><text x="792" y="321" class="body">list archive</text><text x="792" y="349" class="body">record date and owner</text></g><g><rect x="1110" y="225" width="380" height="180" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="1110" y="225" width="380" height="44" rx="20" fill="#0C1D3A"/><rect x="1110" y="249" width="380" height="20" fill="#0C1D3A"/><text x="1132" y="256" class="box-title">4. Test restore</text><text x="1132" y="293" class="body">new empty database</text><text x="1132" y="321" class="body">restore and migrate</text><text x="1132" y="349" class="body">run health and smoke checks</text></g><g><rect x="600" y="550" width="400" height="170" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="600" y="550" width="400" height="44" rx="20" fill="#0C1D3A"/><rect x="600" y="574" width="400" height="20" fill="#0C1D3A"/><text x="622" y="581" class="box-title">Production restore gate</text><text x="622" y="618" class="body">explicit authorization</text><text x="622" y="646" class="body">current backup retained</text><text x="622" y="674" class="body">rollback path documented</text></g><g><path d="M 350 315 L 430 315" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g><g><path d="M 690 315 L 770 315" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g><g><path d="M 1030 315 L 1110 315" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g><g><path d="M 1300 405 L 800 550" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="1050" y="467.5" class="label" text-anchor="middle">only after proof</text></g>
  <text x="70" y="866" class="subtitle">Nexora handoff edition · source 211483f · 2026-10-01</text></svg>
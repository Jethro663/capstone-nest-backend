  <text x="70" y="74" class="title">Request and trust flow</text><text x="70" y="112" class="subtitle">The backend checks identity and policy before official records change.</text><g><rect x="80" y="210" width="260" height="170" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="80" y="210" width="260" height="44" rx="20" fill="#0C1D3A"/><rect x="80" y="234" width="260" height="20" fill="#0C1D3A"/><text x="102" y="241" class="box-title">1. Client</text><text x="102" y="278" class="body">Sends HTTPS request</text><text x="102" y="306" class="body">with cookie or bearer</text></g><g><rect x="430" y="210" width="280" height="170" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="430" y="210" width="280" height="44" rx="20" fill="#0C1D3A"/><rect x="430" y="234" width="280" height="20" fill="#0C1D3A"/><text x="452" y="241" class="box-title">2. Auth and RBAC</text><text x="452" y="278" class="body">Validate session</text><text x="452" y="306" class="body">resolve role</text><text x="452" y="334" class="body">check account state</text></g><g><rect x="800" y="210" width="300" height="170" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="800" y="210" width="300" height="44" rx="20" fill="#0C1D3A"/><rect x="800" y="234" width="300" height="20" fill="#0C1D3A"/><text x="822" y="241" class="box-title">3. Domain policy</text><text x="822" y="278" class="body">Validate DTO</text><text x="822" y="306" class="body">check academic state</text><text x="822" y="334" class="body">apply invariant</text></g><g><rect x="1190" y="210" width="320" height="170" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="1190" y="210" width="320" height="44" rx="20" fill="#0C1D3A"/><rect x="1190" y="234" width="320" height="20" fill="#0C1D3A"/><text x="1212" y="241" class="box-title">4. Durable write</text><text x="1212" y="278" class="body">Transaction</text><text x="1212" y="306" class="body">audit record</text><text x="1212" y="334" class="body">response envelope</text></g><g><rect x="430" y="540" width="280" height="170" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="430" y="540" width="280" height="44" rx="20" fill="#0C1D3A"/><rect x="430" y="564" width="280" height="20" fill="#0C1D3A"/><text x="452" y="571" class="box-title">Long work</text><text x="452" y="608" class="body">Create BullMQ job</text><text x="452" y="636" class="body">return job identity</text><text x="452" y="664" class="body">poll or notify</text></g><g><rect x="800" y="540" width="300" height="170" rx="20" fill="#FFFFFF" stroke="#0C1D3A" stroke-width="3"/><rect x="800" y="540" width="300" height="44" rx="20" fill="#0C1D3A"/><rect x="800" y="564" width="300" height="20" fill="#0C1D3A"/><text x="822" y="571" class="box-title">AI boundary</text><text x="822" y="608" class="body">Internal shared secret</text><text x="822" y="636" class="body">draft output only</text><text x="822" y="664" class="body">teacher review</text></g><g><path d="M 340 295 L 430 295" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g><g><path d="M 710 295 L 800 295" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g><g><path d="M 1100 295 L 1190 295" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g><g><path d="M 950 380 L 570 540" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="760" y="450" class="label" text-anchor="middle">when asynchronous</text></g><g><path d="M 710 625 L 800 625" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g>

# Explicit local-only debugging ports. Compose does not load this file unless it
# is passed with `-f`, keeping the default topology free of data-store and AI ports.
services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
  ai-service:
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

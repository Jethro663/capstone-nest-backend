services:
  # PostgreSQL
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in root .env)}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capstone"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - lms-network

  # Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - lms-network

  # Ollama (AI runtime)
  ollama:
    # Pinned after validating the configured model-pull/readiness contract.
    image: ollama/ollama:0.31.1
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
          ollama serve &
          SERVE_PID=$$!

          echo '==> Waiting for Ollama server to start...'
          i=0
          while [ $$i -lt 30 ]; do
            if curl -sf http://localhost:11434/ > /dev/null 2>&1; then
              break
            fi
            sleep 2
            i=$$((i+1))
          done

          echo "==> Pulling text model: $$OLLAMA_TEXT_MODEL"
          ollama pull "$$OLLAMA_TEXT_MODEL"

          echo "==> Pulling vision model: $$OLLAMA_VISION_MODEL"
          ollama pull "$$OLLAMA_VISION_MODEL"

          echo "==> Pulling embedding model: $$OLLAMA_EMBED_MODEL"
          ollama pull "$$OLLAMA_EMBED_MODEL"

          echo "==> All models are ready. Ollama is serving."

          wait "$$SERVE_PID"
    environment:
      - OLLAMA_TEXT_MODEL=${OLLAMA_TEXT_MODEL:-qwen2.5:3b}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-gemma3:4b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama show \"$$OLLAMA_TEXT_MODEL\" >/dev/null && ollama show \"$$OLLAMA_VISION_MODEL\" >/dev/null && ollama show \"$$OLLAMA_EMBED_MODEL\" >/dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks:
      - lms-network

  # NestJS backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "${BACKEND_DATABASE_URL:?BACKEND_DATABASE_URL is required (set it in root .env)}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required (set it in root .env)}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required (set it in root .env)}"
      OTP_PEPPER: "${OTP_PEPPER:?OTP_PEPPER is required (set it in root .env)}"
      AI_SERVICE_SHARED_SECRET: "${AI_SERVICE_SHARED_SECRET:?AI_SERVICE_SHARED_SECRET is required (set it in root .env)}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SERVICE_NAME: "nexora-backend"
      LOKI_HOST: "${LOKI_HOST:-}"
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - lms-network

  # Python AI service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ai-service/.env.docker
    environment:
      DATABASE_URL: "${AI_DATABASE_URL:?AI_DATABASE_URL is required (set it in root .env)}"
      AI_SERVICE_SHARED_SECRET: "${AI_SERVICE_SHARED_SECRET:?AI_SERVICE_SHARED_SECRET is required (set it in root .env)}"
      BACKEND_INTERNAL_URL: "http://backend:3000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=5).getcode() < 500 else 1)\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - lms-network

  # Next.js frontend
  frontend:
    build:
      context: ./next-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lms-network

  # Observability stack (opt-in profile)
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - lms-network

  blackbox-exporter:
    profiles: [observability]
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9115/-/healthy"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - lms-network

  loki:
    profiles: [observability]
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      - lms-network

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo-config.yml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks:
      - lms-network

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.6.16
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required for the observability profile}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required for the observability profile}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Alert rules are provisioned with the stack, but delivery is opt-in so a
      # local environment without SMTP does not continuously emit failed sends.
      GF_UNIFIED_ALERTING_ENABLED: "${GRAFANA_ALERTING_ENABLED:-false}"
      GF_SMTP_ENABLED: "${GF_SMTP_ENABLED:-false}"
      GF_SMTP_HOST: "${GF_SMTP_HOST:-}"
      GF_SMTP_USER: "${GF_SMTP_USER:-}"
      GF_SMTP_PASSWORD: "${GF_SMTP_PASSWORD:-}"
      GF_SMTP_FROM_ADDRESS: "${GF_SMTP_FROM_ADDRESS:-alerts@nexora.local}"
      GRAFANA_ALERT_EMAIL: "${GRAFANA_ALERT_EMAIL:-ops@example.invalid}"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - lms-network

  promtail:
    profiles: [observability]
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/run/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9080/ready"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10s
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - lms-network

  node-exporter:
    profiles: [observability]
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/udev/data:/run/udev/data:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - lms-network

  cadvisor:
    profiles: [observability]
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - lms-network

volumes:
  postgres_data:
  ollama_data:
  backend_uploads:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  promtail_positions:

networks:
  lms-network:
    driver: bridge
